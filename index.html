<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ارزون‌یاب</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #222;
    }

    .header {
      background: #16a085;
      color: white;
      padding: 25px 20px 35px;
      text-align: center;
      border-radius: 0 0 25px 25px;
    }

    .header h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 14px;
    }

    .container {
      width: 92%;
      max-width: 600px;
      margin: -20px auto 30px;
    }

    .search-box {
      background: white;
      padding: 15px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }

    .search-box button {
      border: none;
      background: #16a085;
      color: white;
      padding: 0 18px;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
    }

    .section-title {
      margin: 30px 5px 15px;
      font-size: 19px;
    }

    .product-card {
      background: white;
      padding: 18px;
      margin-bottom: 14px;
      border-radius: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .product-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .store {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-top: 1px solid #eee;
    }

    .store-name {
      font-size: 14px;
    }

    .price {
      font-weight: bold;
      color: #16a085;
    }

    .cheap {
      background: #e8f8f5;
      color: #12806b;
      padding: 4px 7px;
      border-radius: 8px;
      font-size: 10px;
      margin-right: 5px;
    }

    .not-found {
      background: white;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
      color: #777;
      line-height: 2;
    }

    .footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      padding: 25px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🛒 ارزون‌یاب</h1>
    <p>ارزون‌ترین قیمت محصولات اطرافت رو پیدا کن</p>
  </div>

  <div class="container">

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="مثلاً روغن، برنج، شامپو..."
        onkeydown="if(event.key === 'Enter') searchProduct()"
      >

      <button onclick="searchProduct()">
        جستجو
      </button>
    </div>

    <h2 class="section-title" id="title">
      محصولات
    </h2>

    <div id="results"></div>

  </div>

  <div class="footer">
    ارزون‌یاب — مقایسه قیمت فروشگاه‌ها
  </div>


  <script>

    const products = [

      {
        name: "روغن مایع ۱.۵ لیتری",
        stores: [
          { name: "فروشگاه مرکزی", price: 185000 },
          { name: "فروشگاه بهار", price: 175000 },
          { name: "فروشگاه شهر", price: 180000 }
        ]
      },

      {
        name: "برنج ایرانی ۱۰ کیلویی",
        stores: [
          { name: "فروشگاه مرکزی", price: 1250000 },
          { name: "فروشگاه بهار", price: 1190000 },
          { name: "فروشگاه شهر", price: 1220000 }
        ]
      },

      {
        name: "شامپو ۴۰۰ میلی‌لیتری",
        stores: [
          { name: "فروشگاه مرکزی", price: 165000 },
          { name: "فروشگاه بهار", price: 149000 },
          { name: "فروشگاه شهر", price: 158000 }
        ]
      },

      {
        name: "شکر ۱ کیلویی",
        stores: [
          { name: "فروشگاه مرکزی", price: 78000 },
          { name: "فروشگاه بهار", price: 72000 },
          { name: "فروشگاه شهر", price: 75000 }
        ]
      }

    ];


    function formatPrice(price) {
      return price.toLocaleString("fa-IR") + " تومان";
    }


    function showProducts(list) {

      const results = document.getElementById("results");

      results.innerHTML = "";

      if (list.length === 0) {

        results.innerHTML = `
          <div class="not-found">
            محصولی با این نام پیدا نشد.
            <br>
            نام محصول دیگری را امتحان کن.
          </div>
        `;

        return;
      }


      list.forEach(product => {

        const cheapestPrice = Math.min(
          ...product.stores.map(store => store.price)
        );


        let storesHTML = "";


        product.stores.forEach(store => {

          const isCheapest =
            store.price === cheapestPrice;


          storesHTML += `
            <div class="store">

              <span class="store-name">
                ${store.name}

                ${
                  isCheapest
                  ? '<span class="cheap">ارزان‌ترین</span>'
                  : ''
                }

              </span>

              <span class="price">
                ${formatPrice(store.price)}
              </span>

            </div>
          `;

        });


        results.innerHTML += `

          <div class="product-card">

            <div class="product-name">
              ${product.name}
            </div>

            ${storesHTML}

          </div>

        `;

      });

    }


    function searchProduct() {

      const text =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


      if (text === "") {

        document.getElementById("title").innerText =
          "محصولات";

        showProducts(products);

        return;
      }


      const results = products.filter(product =>
        product.name.toLowerCase().includes(text)
      );


      document.getElementById("title").innerText =
        "نتیجه جستجو";


      showProducts(results);

    }


    showProducts(products);

  </script>

</body>
</html>
