<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ارزون‌یاب</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #222;
    }

    .header {
      background: #16a085;
      color: white;
      padding: 25px 20px 35px;
      text-align: center;
      border-radius: 0 0 25px 25px;
    }

    .header h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      width: 92%;
      max-width: 600px;
      margin: -20px auto 30px;
    }

    .search-box {
      background: white;
      padding: 15px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }

    .search-box button {
      border: none;
      background: #16a085;
      color: white;
      padding: 0 18px;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
    }

    .section-title {
      margin: 30px 5px 15px;
      font-size: 19px;
    }

    .product-card {
      background: white;
      padding: 18px;
      margin-bottom: 12px;
      border-radius: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .product-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .store {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-top: 1px solid #eee;
    }

    .store-name {
      font-size: 14px;
    }

    .price {
      font-weight: bold;
      color: #16a085;
    }

    .cheap {
      background: #e8f8f5;
      color: #12806b;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 11px;
      margin-right: 5px;
    }

    .empty {
      text-align: center;
      color: #777;
      margin-top: 30px;
      line-height: 2;
    }

    .footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      padding: 25px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🛒 ارزون‌یاب</h1>
    <p>ارزون‌ترین قیمت محصولات اطرافت رو پیدا کن</p>
  </div>

  <div class="container">

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="مثلاً روغن، برنج، شامپو..."
      >

      <button onclick="searchProduct()">
        جستجو
      </button>
    </div>

    <h2 class="section-title">نمونه قیمت‌ها</h2>

    <div id="results">

      <div class="product-card">
        <div class="product-name">
          روغن مایع ۱.۵ لیتری
        </div>

        <div class="store">
          <span class="store-name">فروشگاه مرکزی</span>
          <span class="price">۱۸۵٬۰۰۰ تومان</span>
        </div>

        <div class="store">
          <span class="store-name">
            فروشگاه بهار
            <span class="cheap">ارزان‌ترین</span>
          </span>
          <span class="price">۱۷۵٬۰۰۰ تومان</span>
        </div>

        <div class="store">
          <span class="store-name">فروشگاه شهر</span>
          <span class="price">۱۸۰٬۰۰۰ تومان</span>
        </div>
      </div>

    </div>

    <div class="empty" id="message">
      محصول موردنظرت رو جستجو کن
    </div>

  </div>

  <div class="footer">
    ارزون‌یاب — مقایسه قیمت فروشگاه‌ها
  </div>

  <script>

    function searchProduct() {

      const input = document.getElementById("searchInput");
      const message = document.getElementById("message");

      if (input.value.trim() === "") {
        message.innerText = "لطفاً نام یک محصول را وارد کن";
        return;
      }

      message.innerText =
        "در نسخه بعدی، قیمت فروشگاه‌ها برای «" +
        input.value +
        "» نمایش داده می‌شود.";
    }

  </script>

</body>
  </html>
